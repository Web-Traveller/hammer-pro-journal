name: Release Workflow

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release-desktop:
    name: Build & Release Desktop (Windows)
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Build Tauri Desktop & Publish Release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Hammer Pro Journal v__VERSION__'
          releaseBody: 'Hammer Pro Journal v__VERSION__ - Full Cloudflare R2 Sync, Mobile Terminal, and Tape Analytics'
          releaseDraft: false
          prerelease: false
          createUpdaterArtifacts: true

  release-android:
    name: Build & Attach Android APK
    needs: release-desktop
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"

      - name: Set NDK Environment
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Rust Toolchain with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Dependencies
        run: npm ci

      - name: Initialize Tauri Android & Generate Icons
        run: |
          npx tauri icon ./src-tauri/icons/icon.png || true
          npx tauri android init || true
          if [ -d "src-tauri/gen/android/app/src/main/res" ]; then
            cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/ || true
          fi

      - name: Build Android APK
        run: npx tauri android build --apk --target aarch64

      - name: Sign & Align Android APK
        id: sign-apk
        run: |
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found RAW APK: $RAW_APK"
          if [ -n "$RAW_APK" ]; then
            keytool -genkey -v -keystore release.keystore -alias hammerpro -keyalg RSA -keysize 2048 -validity 10000 -storepass hammerpro123 -keypass hammerpro123 -dname "CN=HammerPro, OU=Trading, O=HammerPro, L=US, S=NY, C=US"
            $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$RAW_APK" ./aligned.apk
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:hammerpro123 --ks-key-alias hammerpro --key-pass pass:hammerpro123 --out ./HammerPro-Journal-v2.0.0-Android.apk ./aligned.apk
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose ./HammerPro-Journal-v2.0.0-Android.apk
            echo "apk_path=./HammerPro-Journal-v2.0.0-Android.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload Signed APK to GitHub Release
        if: steps.sign-apk.outputs.apk_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.sign-apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
